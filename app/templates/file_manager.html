<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FileVault — 安全文件管理系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ── CSS 变量 ─────────────────────────────── */
    :root {
      --bg:       #0e0f13;
      --surface:  #16181f;
      --surface2: #1e2029;
      --border:   #2a2d3a;
      --accent:   #5b6ef5;
      --accent2:  #38d9a9;
      --danger:   #f03e3e;
      --warn:     #f59f00;
      --text:     #e8eaf0;
      --muted:    #6c7283;
      --sidebar-w: 220px;
      --header-h:  56px;
    }

    /* ── Reset & Base ──────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────── */
    header {
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
      flex-shrink: 0;
      z-index: 100;
    }
    .logo {
      font-family: 'Space Mono', monospace;
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon {
      width: 28px; height: 28px;
      background: var(--accent);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .breadcrumb {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
    }
    .breadcrumb span { color: var(--text); }
    .breadcrumb .sep { color: var(--border); }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .user-badge {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px 4px 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .user-avatar {
      width: 24px; height: 24px;
      background: var(--accent);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700;
    }
    .role-chip {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      background: rgba(91,110,245,.18);
      color: var(--accent);
      border: 1px solid rgba(91,110,245,.3);
    }

    /* ── Layout ──────────────────────────────────── */
    .app-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ─────────────────────────────────── */
    aside {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
    }
    .sidebar-section { padding: 16px 12px 8px; }
    .sidebar-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      padding: 0 8px;
      margin-bottom: 6px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13.5px;
      cursor: pointer;
      color: var(--muted);
      transition: all .15s;
      user-select: none;
    }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: rgba(91,110,245,.15); color: var(--accent); }
    .nav-item .icon { width: 16px; text-align: center; font-size: 15px; }
    .sidebar-divider { border: none; border-top: 1px solid var(--border); margin: 8px 12px; }

    /* ── Main Content ────────────────────────────── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Toolbar ─────────────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .btn {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: #4a5de0; }
    .btn.danger { color: var(--danger); border-color: var(--danger); }
    .btn.danger:hover { background: rgba(240,62,62,.1); }
    .btn:disabled { opacity: .35; cursor: not-allowed; }
    .toolbar-sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }
    .search-box {
      flex: 1; max-width: 280px;
      display: flex; align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 0 10px;
      gap: 6px;
    }
    .search-box input {
      background: transparent; border: none; outline: none;
      color: var(--text); font-size: 13px; font-family: 'DM Sans', sans-serif;
      width: 100%; padding: 6px 0;
    }
    .search-box input::placeholder { color: var(--muted); }
    .view-toggle { display: flex; gap: 2px; margin-left: auto; }
    .view-btn {
      padding: 6px 8px; border-radius: 6px; border: 1px solid transparent;
      background: transparent; color: var(--muted); cursor: pointer; font-size: 15px;
      transition: all .15s;
    }
    .view-btn.active { background: var(--surface2); border-color: var(--border); color: var(--text); }

    /* ── File Grid / List ────────────────────────── */
    .file-area {
      flex: 1; overflow-y: auto; padding: 20px;
    }
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
    }
    .file-list { display: flex; flex-direction: column; gap: 2px; }

    /* ── File Card (grid) ───────────────────────── */
    .file-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 12px 12px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      cursor: pointer;
      transition: all .15s;
      position: relative;
      user-select: none;
    }
    .file-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(91,110,245,.15); }
    .file-card.selected { border-color: var(--accent); background: rgba(91,110,245,.08); }
    .file-icon { font-size: 36px; line-height: 1; }
    .file-name {
      font-size: 12px; text-align: center;
      word-break: break-all;
      color: var(--text);
      max-width: 100%;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .file-meta { font-size: 10px; color: var(--muted); font-family: 'Space Mono', monospace; }
    .file-card .check {
      position: absolute; top: 6px; right: 6px;
      width: 16px; height: 16px;
      border-radius: 4px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      display: none;
    }
    .file-card.selected .check { display: flex; align-items: center; justify-content: center; background: var(--accent); border-color: var(--accent); font-size: 10px; }

    /* ── File Row (list) ─────────────────────────── */
    .file-row {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background .1s;
      border: 1px solid transparent;
    }
    .file-row:hover { background: var(--surface); }
    .file-row.selected { background: rgba(91,110,245,.08); border-color: rgba(91,110,245,.3); }
    .file-row .row-icon { font-size: 20px; flex-shrink: 0; }
    .file-row .row-name { flex: 1; font-size: 13.5px; }
    .file-row .row-meta { font-size: 11px; color: var(--muted); font-family: 'Space Mono', monospace; min-width: 80px; text-align: right; }
    .file-row .row-date { font-size: 11px; color: var(--muted); min-width: 140px; text-align: right; }

    /* ── List Header ─────────────────────────────── */
    .list-header {
      display: flex; align-items: center; gap: 12px;
      padding: 6px 12px;
      font-size: 11px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      text-transform: uppercase;
      letter-spacing: .5px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }
    .list-header span:first-child { flex: 1; }
    .list-header .h-meta { min-width: 80px; text-align: right; }
    .list-header .h-date { min-width: 140px; text-align: right; }

    /* ── Status Bar ──────────────────────────────── */
    .statusbar {
      display: flex; align-items: center; gap: 16px;
      padding: 6px 20px;
      border-top: 1px solid var(--border);
      font-size: 11.5px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      background: var(--surface);
      flex-shrink: 0;
    }
    .statusbar span { display: flex; align-items: center; gap: 4px; }

    /* ── Right Panel ─────────────────────────────── */
    .right-panel {
      width: 260px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow-y: auto;
      transition: width .2s;
    }
    .right-panel.collapsed { width: 0; overflow: hidden; }
    .panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      display: flex; justify-content: space-between; align-items: center;
    }
    .panel-body { padding: 16px; }
    .detail-icon { font-size: 48px; text-align: center; margin-bottom: 12px; }
    .detail-name { font-size: 14px; font-weight: 600; word-break: break-all; margin-bottom: 12px; }
    .detail-row {
      display: flex; justify-content: space-between;
      font-size: 12px; padding: 5px 0;
      border-bottom: 1px solid var(--border);
    }
    .detail-row .dk { color: var(--muted); }
    .detail-row .dv { font-family: 'Space Mono', monospace; font-size: 11px; }
    .perm-list { margin-top: 12px; }
    .perm-tag {
      display: inline-block;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 4px;
      margin: 2px;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
    }
    .perm-tag.have { background: rgba(56,217,169,.15); color: var(--accent2); border: 1px solid rgba(56,217,169,.3); }
    .perm-tag.deny { background: rgba(240,62,62,.1); color: var(--danger); border: 1px solid rgba(240,62,62,.2); }

    /* ── Modal ───────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.65);
      display: flex; align-items: center; justify-content: center;
      z-index: 999;
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
    }
    .modal-overlay.show { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 380px;
      transform: translateY(10px);
      transition: transform .2s;
    }
    .modal-overlay.show .modal { transform: translateY(0); }
    .modal h3 { font-size: 15px; margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-family: 'Space Mono', monospace; }
    .form-group input {
      width: 100%; padding: 8px 12px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 7px; color: var(--text); font-size: 13px;
      font-family: 'DM Sans', sans-serif; outline: none;
      transition: border-color .15s;
    }
    .form-group input:focus { border-color: var(--accent); }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

    /* ── Toast ───────────────────────────────────── */
    .toast-container {
      position: fixed; bottom: 24px; right: 24px;
      display: flex; flex-direction: column; gap: 8px;
      z-index: 9999; pointer-events: none;
    }
    .toast {
      padding: 10px 16px; border-radius: 8px;
      font-size: 13px; min-width: 220px;
      display: flex; align-items: center; gap: 8px;
      pointer-events: all;
      animation: slideIn .25s ease-out;
      border: 1px solid;
    }
    .toast.success { background: rgba(56,217,169,.12); border-color: rgba(56,217,169,.3); color: var(--accent2); }
    .toast.error   { background: rgba(240,62,62,.12);  border-color: rgba(240,62,62,.3);  color: var(--danger); }
    .toast.info    { background: rgba(91,110,245,.12); border-color: rgba(91,110,245,.3); color: var(--accent); }
    @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }

    /* ── Upload Zone ─────────────────────────────── */
    .upload-zone {
      position: absolute; inset: 0;
      background: rgba(91,110,245,.07);
      border: 2px dashed var(--accent);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none; opacity: 0;
      transition: opacity .15s;
      font-size: 20px; color: var(--accent);
      z-index: 50;
      flex-direction: column; gap: 8px;
    }
    .upload-zone.show { opacity: 1; }

    /* ── Scrollbar ───────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    /* ── Audit Panel ─────────────────────────────── */
    .audit-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .audit-table th {
      text-align: left; padding: 8px 10px;
      font-family: 'Space Mono', monospace; font-size: 10px;
      text-transform: uppercase; letter-spacing: .5px;
      color: var(--muted); border-bottom: 1px solid var(--border);
    }
    .audit-table td { padding: 7px 10px; border-bottom: 1px solid rgba(42,45,58,.5); }
    .audit-table tr:hover td { background: var(--surface2); }
    .status-badge {
      display: inline-block; padding: 1px 6px; border-radius: 4px;
      font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700;
    }
    .status-badge.success { background: rgba(56,217,169,.15); color: var(--accent2); }
    .status-badge.denied  { background: rgba(240,62,62,.12);  color: var(--danger); }
    .status-badge.error   { background: rgba(245,159,0,.12);   color: var(--warn); }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">
    <div class="logo-icon">🔐</div>
    FileVault
  </div>
  <div class="breadcrumb" id="breadcrumb">
    <span>根目录</span>
  </div>
  <div class="header-actions">
    <div class="user-badge" id="userBadge">
      <div class="user-avatar" id="userInitial">?</div>
      <span id="userName">加载中…</span>
      <span class="role-chip" id="userRole">—</span>
    </div>
    <button class="btn danger" onclick="logout()" style="padding:5px 10px;font-size:12px">登出</button>
  </div>
</header>

<div class="app-body">

  <!-- Sidebar -->
  <aside>
    <div class="sidebar-section">
      <div class="sidebar-label">文件管理</div>
      <div class="nav-item active" onclick="switchView('files')" id="nav-files">
        <span class="icon">📁</span> 我的文件
      </div>
      <div class="nav-item" onclick="switchView('shared')" id="nav-shared">
        <span class="icon">🌐</span> 共享文件
      </div>
      <div class="nav-item" onclick="switchView('recent')" id="nav-recent">
        <span class="icon">🕐</span> 最近访问
      </div>
    </div>
    <hr class="sidebar-divider">
    <div class="sidebar-section">
      <div class="sidebar-label">管理</div>
      <div class="nav-item" onclick="switchView('users')" id="nav-users">
        <span class="icon">👥</span> 用户管理
      </div>
      <div class="nav-item" onclick="switchView('roles')" id="nav-roles">
        <span class="icon">🛡️</span> 角色权限
      </div>
      <div class="nav-item" onclick="switchView('audit')" id="nav-audit">
        <span class="icon">📋</span> 审计日志
      </div>
    </div>
    <hr class="sidebar-divider">
    <div class="sidebar-section">
      <div class="sidebar-label">存储</div>
      <div style="padding: 8px 10px;">
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px;font-family:'Space Mono',monospace;">已用 / 总量</div>
        <div style="height:4px;background:var(--border);border-radius:2px;overflow:hidden;">
          <div id="storageBar" style="height:100%;background:var(--accent);border-radius:2px;width:34%;transition:width .5s;"></div>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:5px;font-family:'Space Mono',monospace;">3.4 GB / 10 GB</div>
      </div>
    </div>
    <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center;">
    <h3 id="previewTitle">在线文件预览</h3>
    <div style="display: flex; align-items: center; gap: 12px;">
      <button id="modalDownloadBtn" class="btn-primary" style="padding: 6px 12px; font-size: 13px; display: none;">
        ⬇ 下载此文件
      </button>
      <button class="btn-icon" onclick="closePreviewModal()">✕</button>
    </div>
  </div>
  </aside>

  <!-- Main -->
  <main id="mainArea">

    <!-- File View -->
    <div id="view-files" class="view-section">
      <div class="toolbar">
        <button class="btn primary" onclick="showUploadModal()" id="btnUpload">⬆ 上传</button>
        <button class="btn" onclick="showFolderModal()" id="btnNewFolder">📁 新建文件夹</button>
        <div class="toolbar-sep"></div>
        <button class="btn danger" onclick="deleteSelected()" id="btnDelete" disabled>🗑 删除</button>
        <button class="btn" onclick="renameSelected()" id="btnRename" disabled>✏️ 重命名</button>
        <div class="toolbar-sep"></div>
        <div class="search-box">
          <span style="color:var(--muted);font-size:14px">🔍</span>
          <input type="text" placeholder="搜索文件…" oninput="filterFiles(this.value)">
        </div>
        <div class="view-toggle">
          <button class="view-btn active" onclick="setView('grid')" id="vbGrid" title="网格">▦</button>
          <button class="view-btn" onclick="setView('list')" id="vbList" title="列表">☰</button>
        </div>
      </div>

      <div style="position:relative;flex:1;overflow:hidden;display:flex;">
        <div class="file-area" id="fileArea">
          <div class="file-grid" id="fileContainer"></div>
          <!-- 拖拽上传提示 -->
          <div class="upload-zone" id="uploadZone">
            <div style="font-size:40px">📥</div>
            <div>拖拽文件到此处上传</div>
          </div>
        </div>
        <!-- 详情面板 -->
        <div class="right-panel collapsed" id="rightPanel">
          <div class="panel-header">
            <span>详情</span>
            <span style="cursor:pointer;color:var(--muted)" onclick="closePanel()">✕</span>
          </div>
          <div class="panel-body" id="panelBody"></div>
        </div>
      </div>

      <div class="statusbar">
        <span>📁 <span id="fileCount">0</span> 个项目</span>
        <span>✅ <span id="selCount">0</span> 已选中</span>
        <span id="permIndicator"></span>
      </div>
    </div>

    <!-- Audit View -->
    <div id="view-audit" class="view-section" style="display:none;flex-direction:column;height:100%;">
      <div class="toolbar">
        <span style="font-size:13px;font-weight:600;">📋 审计日志</span>
        <div class="toolbar-sep"></div>
        <button class="btn" onclick="exportAudit()">⬇ 导出 CSV</button>
        <select id="auditFilter" onchange="loadAudit()" style="background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:7px;font-size:13px;cursor:pointer;">
          <option value="">全部操作</option>
          <option value="file:read">file:read</option>
          <option value="file:write">file:write</option>
          <option value="file:delete">file:delete</option>
          <option value="file:update">file:update</option>
          <option value="audit:view">audit:view</option>
        </select>
        <select id="auditStatusFilter" onchange="loadAudit()" style="background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:7px;font-size:13px;cursor:pointer;">
          <option value="">全部状态</option>
          <option value="success">success</option>
          <option value="denied">denied</option>
        </select>
      </div>
      <div style="flex:1;overflow:auto;padding:16px;">
        <table class="audit-table">
          <thead>
            <tr>
              <th>时间</th><th>用户</th><th>操作</th><th>资源</th><th>IP</th><th>状态</th>
            </tr>
          </thead>
          <tbody id="auditBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Roles View -->
    <div id="view-roles" class="view-section" style="display:none;flex-direction:column;height:100%;">
      <div class="toolbar">

// ══════════════════════════════════════════════

// ══════════════════════════════════════════════
function fileIcon(file) {
  if (file.is_directory) return '📁';
  const m = file.mime_type || '';
  const n = file.name.toLowerCase();
  if (m.includes('pdf'))   return '📄';
  if (m.includes('image')) return '🖼️';
  if (m.includes('zip') || m.includes('tar') || n.endsWith('.gz')) return '📦';
  if (n.endsWith('.xlsx') || n.endsWith('.xls')) return '📊';
  if (n.endsWith('.docx') || n.endsWith('.doc')) return '📝';
  if (n.endsWith('.md'))   return '📋';
  if (n.endsWith('.txt'))  return '🗒️';
  return '📄';
}

function fmtSize(bytes) {
  if (!bytes) return '—';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(1) + ' MB';
}

function renderFiles() {
  const container = document.getElementById('fileContainer');
  const files = state.filteredFiles;
  document.getElementById('fileCount').textContent = files.length;

  if (state.viewMode === 'grid') {
    container.className = 'file-grid';
    container.innerHTML = files.map(f => `
      <div class="file-card ${state.selected.has(f.id) ? 'selected' : ''}"
           onclick="selectFile(${f.id}, event)"
           ondblclick="openFile(${f.id})">
        <div class="check">✓</div>
        <div class="file-icon">${fileIcon(f)}</div>
        <div class="file-name">${f.name}</div>
        <div class="file-meta">${fmtSize(f.size)}</div>
      </div>
    `).join('');
  } else {
    container.className = 'file-list';
    container.innerHTML = `
      <div class="list-header">
        <span>名称</span>
        <span class="h-meta">大小</span>
        <span class="h-date">修改时间</span>
      </div>
      ${files.map(f => `
        <div class="file-row ${state.selected.has(f.id) ? 'selected' : ''}"
             onclick="selectFile(${f.id}, event)"
             ondblclick="openFile(${f.id})">
          <span class="row-icon">${fileIcon(f)}</span>
          <span class="row-name">${f.name}</span>
          <span class="row-meta">${fmtSize(f.size)}</span>
          <span class="row-date">${f.updated_at}</span>
        </div>
      `).join('')}
    `;
  }
}

function filterFiles(q) {
  q = q.toLowerCase().trim();
  state.filteredFiles = q
    ? state.files.filter(f => f.name.toLowerCase().includes(q))
    : [...state.files];
  state.selected.clear();
  updateSelectionUI();
  renderFiles();
}

// ══════════════════════════════════════════════
//  Selection
// ══════════════════════════════════════════════
function selectFile(id, e) {
  if (e && (e.ctrlKey || e.metaKey)) {
    state.selected.has(id) ? state.selected.delete(id) : state.selected.add(id);
  } else {
    const wasOnly = state.selected.size === 1 && state.selected.has(id);
    state.selected.clear();
    if (!wasOnly) state.selected.add(id);
  }
  updateSelectionUI();
  renderFiles();
  // 右侧详情面板
  if (state.selected.size === 1) showPanel([...state.selected][0]);
  else closePanel();
}

function updateSelectionUI() {
  const n = state.selected.size;
  document.getElementById('selCount').textContent = n;
  const hasDel = state.userPerms.has('file:delete');
  const hasRen = state.userPerms.has('file:update');
  document.getElementById('btnDelete').disabled = !n || !hasDel;
  document.getElementById('btnRename').disabled = n !== 1 || !hasRen;
}

function openFile(id) {
  const safeId = parseInt(id, 10);
  if (isNaN(safeId)) {
    toast(' 异常：非法的文件 ID', 'error');
    return;
  }

  const f = state.files.find(x => parseInt(x.id, 10) === safeId);
  if (!f) {
    toast('找不到对应的文件数据', 'error');
    return;
  }
  
  if (f.is_directory) {
    // 文件夹下载
    state.currentParent = f.id;
    state.pathStack.push(f.name);
    if (typeof loadFiles === 'function') loadFiles();
  } else {
  // 🌟 新增防线：判断是不是 Word/Excel 等浏览器无法直视的办公文档
  const isOfficeDoc = f.name.toLowerCase().endsWith('.docx') || 
                      f.name.toLowerCase().endsWith('.doc') || 
                      f.name.toLowerCase().endsWith('.xlsx');

  if (state.userPerms.has('file:read')) {
    const viewer = document.getElementById('previewViewer');
    const downloadBtn = document.getElementById('modalDownloadBtn');
    
    document.getElementById('previewTitle').textContent = `在线文件预览：${f.name}`;
    
    // 🚀 分支 A：有下载权限（Admin 等）
    if (state.userPerms.has('file:download')) {
      // 如果是 Word 且有下载权，别让人看空白了，直接帮他触发物理下载！
      if (isOfficeDoc) {
        toast(` ${f.name} 是 Word 文档，已自动为您唤醒本地 Office 下载通道...`, 'success');
        window.open(`/api/files/${safeId}/download`, '_blank');
        return; // 拦截，不弹窗了
      }

      toast(` ${f.name} 加载预览成功，已为您开通下载特权`, 'success');
      if (downloadBtn) { downloadBtn.style.display = 'block'; downloadBtn.onclick = function() { window.open(`/api/files/${safeId}/download`, '_blank'); }; }
      viewer.src = `/api/files/${safeId}/preview`;
      openModal('previewModal');
    } 
    // 🚀 分支 B：只有只读权限（Guest 模式）
    else {
      // 如果是 Guest 碰到了 Word，无情拦截并警告
      if (isOfficeDoc) {
        toast(`抱歉，Word 文档无法在网页内直接安全阅览，且 Guest 账户禁止下载！`, 'error');
        return; // 直接拦截，不弹空白窗
      }

      toast(`开启安全在线阅读通道（此模式禁止下载）...`, 'info');
      if (downloadBtn) { downloadBtn.style.display = 'none'; downloadBtn.onclick = null; }
      viewer.src = `/api/files/${safeId}/preview#toolbar=0&navpanes=0&scrollbar=1`;
      
      const modalBody = viewer.parentElement;
      if (modalBody) { modalBody.oncontextmenu = function() { return false; }; }
      openModal('previewModal');
    }
  } else {
    toast('您没有任何权限操作此文件', 'error');
  }
}
}

  document.getElementById('previewViewer').src = ""; // 清空，释放内存
  closeModal('previewModal');

function showPanel(id) {
  const f = state.files.find(x => x.id === id);
  if (!f) return;
  const panel = document.getElementById('rightPanel');
  panel.classList.remove('collapsed');

  const allFilePerms = ['file:read','file:write','file:update','file:delete','file:download'];
  const permTags = allFilePerms.map(p => {
    const have = state.userPerms.has(p);
    return `<span class="perm-tag ${have ? 'have' : 'deny'}">${have ? '✓' : '✗'} ${p}</span>`;
  }).join('');

  document.getElementById('panelBody').innerHTML = `
    <div class="detail-icon">${fileIcon(f)}</div>
    <div class="detail-name">${f.name}</div>
    <div class="detail-row"><span class="dk">类型</span><span class="dv">${f.is_directory ? '文件夹' : (f.mime_type || '未知')}</span></div>
    <div class="detail-row"><span class="dk">大小</span><span class="dv">${fmtSize(f.size)}</span></div>
    <div class="detail-row"><span class="dk">所有者</span><span class="dv">${f.owner}</span></div>
    <div class="detail-row"><span class="dk">创建时间</span><span class="dv">${f.created_at}</span></div>
    <div class="detail-row"><span class="dk">修改时间</span><span class="dv">${f.updated_at}</span></div>
    <div class="perm-list">
      <div style="font-size:11px;color:var(--muted);margin-bottom:6px;font-family:'Space Mono',monospace;">我的权限</div>
      ${permTags}
    </div>
  `;
}

function closePanel() {
  document.getElementById('rightPanel').classList.add('collapsed');
}

function showUploadModal() { openModal('uploadModal'); }
function showFolderModal()  { openModal('folderModal'); document.getElementById('folderNameInput').value = ''; }

function doUpload() {
  const fileInput = document.getElementById('uploadInput');
  const files = fileInput.files;
  if (!files.length) { toast('请选择文件', 'error'); return; }

  // 使用 FormData 封装多媒体文件流上传
  const formData = new FormData();
  formData.append('file', files[0]); // 你的后端 files.py 里写的是接收单个 "file"
  if (state.currentParent) {
    formData.append('parent_id', state.currentParent);
  }

  toast('⏳ 正在上传至 Flask 服务器...', 'info');

  fetch('/api/files/upload', {
    method: 'POST',
    body: formData // 千万不要加 Content-Type 标头，浏览器会自动处理 boundary
  })
  .then(res => res.json())
  .then(res => {
    if (res.code === 200) {
      toast(`✅ 文件【${files[0].name}】上传并入库成功！`, 'success');
      closeModal('uploadModal');
      fileInput.value = ''; // 清空选择器
      // 重新拉取最新列表
      return fetch('/api/files/').then(r => r.json());
    } else {
      toast(`❌ 上传失败: ${res.error}`, 'error');
    }
  })
  .then(res => {
    if(res) {
      state.files = res.data;
      state.filteredFiles = [...res.data];
      renderFiles();
    }
  })
  .catch(err => console.error("上传失败:", err));
}

function doCreateFolder() {
  const name = document.getElementById('folderNameInput').value.trim();
  if (!name) { toast('请输入文件夹名', 'error'); return; }

  // 🌟 核心点：向后端发起标准 POST 请求
  fetch('/api/files/folder', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name, parent_id: state.currentParent }) // 传递父级文件夹 ID
  })
  .then(res => res.json())
  .then(res => {
    if (res.code === 200) {
      toast(`📁 文件夹【${name}】已成功写入数据库！`, 'success');
      closeModal('folderModal');
      // 重新加载
      return fetch('/api/files/').then(r => r.json());
    } else {
      ctx = res.error || "创建失败";
      toast(`❌ ${ctx}`, 'error');
    }
  })
  .then(res => {
    if(res) {
      state.files = res.data;
      state.filteredFiles = [...res.data];
      renderFiles();
    }
  });
}

function deleteSelected() {
  if (!state.selected.size) return;
  if (!confirm(`确定要删除选中的 ${state.selected.size} 个项目吗？`)) return;

  const ids = [...state.selected];
  
  // 🌟 核心点：循环或者单个向后端发送标准的 DELETE 请求
  // 这里我们采用 Promise.all 同时发送请求
  Promise.all(ids.map(id => 
    fetch(`/api/files/${id}`, { method: 'DELETE' }).then(res => res.json())
  ))
  .then(results => {
    // 检查是否都删除成功
    const successCount = results.filter(r => r.code === 200).length;
    toast(`🗑 成功从数据库删除 ${successCount} 个项目`, 'success');
    
    // 彻底清空选择，并强行重新从后端拉取最新最干净的数据
    state.selected.clear();
    updateSelectionUI();
    
    // 刷新数据流
    fetch('/api/files/')
      .then(res => res.json())
      .then(res => {
         state.files = res.data;
         state.filteredFiles = [...res.data];
         renderFiles();
         closePanel();
      });
  })
  .catch(err => {
    console.error("物理删除失败:", err);
    toast("物理删除失败，请检查后端控制台权限报错", "error");
  });
}

let renameTarget = null;
function renameSelected() {
  if (state.selected.size !== 1) return;
  renameTarget = [...state.selected][0];
  const f = state.files.find(x => x.id === renameTarget);
  document.getElementById('renameInput').value = f ? f.name : '';
  openModal('renameModal');
}

function doRename() {
  const name = document.getElementById('renameInput').value.trim();
  if (!name) { toast('名称不能为空', 'error'); return; }
  const f = state.files.find(x => x.id === renameTarget);
  if (f) f.name = name;
  state.filteredFiles = [...state.files];
  renderFiles();
  toast(`✏️ 已重命名为：${name}`, 'success');
  closeModal('renameModal');
}

function logout() {
  toast('👋 正在清理 Session 登出...', 'info');
  // 🌟 直接重定向到你在 routes.py 里写好的真实的 /logout 路由上！
  setTimeout(() => location.href = '/logout', 500);
}

// ══════════════════════════════════════════════
//  View Switching
// ══════════════════════════════════════════════
function switchView(view) {
  state.currentView = view;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById(`nav-${view}`)?.classList.add('active');
  document.querySelectorAll('.view-section').forEach(el => el.style.display = 'none');
  const target = document.getElementById(`view-${view}`);
  if (target) target.style.display = 'flex';

  if (view === 'audit') loadAudit();
  if (view === 'roles') loadRoles();
  if (view === 'users') loadUsers();
}

function setView(mode) {
  state.viewMode = mode;
  document.getElementById('vbGrid').classList.toggle('active', mode === 'grid');
  document.getElementById('vbList').classList.toggle('active', mode === 'list');
  renderFiles();
}

// ══════════════════════════════════════════════
//  Audit
// ══════════════════════════════════════════════
function loadAudit() {
  const action = document.getElementById('auditFilter').value;
  const status = document.getElementById('auditStatusFilter').value;
  let logs = MOCK_AUDIT;
  if (action) logs = logs.filter(l => l.action === action);
  if (status) logs = logs.filter(l => l.status === status);

  document.getElementById('auditBody').innerHTML = logs.map(l => `
    <tr>
      <td style="font-family:'Space Mono',monospace;font-size:11px;">${l.timestamp}</td>
      <td>${l.user}</td>
      <td style="font-family:'Space Mono',monospace;font-size:11px;">${l.action}</td>
      <td>${l.resource || '—'}</td>
      <td style="color:var(--muted);font-family:'Space Mono',monospace;font-size:10px;">${l.ip_address}</td>
      <td><span class="status-badge ${l.status}">${l.status}</span></td>
    </tr>
  `).join('');
}

function exportAudit() {
  if (!state.userPerms.has('audit:export')) {
    toast('❌ 无审计导出权限', 'error'); return;
  }
  toast('⬇ 正在导出审计日志…', 'info');
}

// ══════════════════════════════════════════════
//  Roles
// ══════════════════════════════════════════════
const PERM_COLORS = {
  'file':   ['rgba(91,110,245,.12)','rgba(91,110,245,.3)','#7b8fff'],
  'admin':  ['rgba(245,159,0,.12)', 'rgba(245,159,0,.3)','#f59f00'],
  'system': ['rgba(56,217,169,.12)','rgba(56,217,169,.3)','#38d9a9'],
};
function loadRoles() {
  document.getElementById('rolesGrid').innerHTML = MOCK_ROLES.map(r => {
    const tags = r.permissions.map(p => {
      const cat = p.split(':')[0];
      const [bg, border, color] = PERM_COLORS[cat] || PERM_COLORS['file'];
      return `<span style="display:inline-block;font-size:10px;padding:2px 7px;border-radius:4px;margin:2px;font-family:'Space Mono',monospace;font-weight:700;background:${bg};border:1px solid ${border};color:${color};">${p}</span>`;
    }).join('');
    return `
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
          <div style="font-size:22px">🛡️</div>
          <div>
            <div style="font-size:14px;font-weight:600;">${r.name}</div>
            <div style="font-size:11px;color:var(--muted);">${r.user_count} 个用户</div>
          </div>
        </div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:10px;">${r.description}</div>
        <div>${tags}</div>
      </div>`;
  }).join('');
}

// ══════════════════════════════════════════════
//  Users
// ══════════════════════════════════════════════
function loadUsers() {
  document.getElementById('usersBody').innerHTML = MOCK_USERS.map(u => `
    <tr>
      <td style="font-weight:500;">${u.username}</td>
      <td style="color:var(--muted);">${u.email}</td>
      <td>${u.roles.map(r => `<span class="role-chip" style="font-size:11px;">${r}</span>`).join(' ')}</td>
      <td><span class="status-badge ${u.is_active ? 'success' : 'denied'}">${u.is_active ? '启用' : '禁用'}</span></td>
      <td style="color:var(--muted);font-size:11px;font-family:'Space Mono',monospace;">${u.created_at}</td>
    </tr>
  `).join('');
}

// ══════════════════════════════════════════════
//  Drag & Drop Upload
// ══════════════════════════════════════════════
function setupDragDrop() {
  const area = document.getElementById('fileArea');
  const zone = document.getElementById('uploadZone');
  area.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('show'); });
  area.addEventListener('dragleave', () => zone.classList.remove('show'));
  area.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('show');
    if (!state.userPerms.has('file:write')) { toast('❌ 无上传权限', 'error'); return; }
    const files = [...e.dataTransfer.files];
    files.forEach(f => {
      const mock = { id: Date.now() + Math.random(), name: f.name, is_directory: false,
                     size: f.size, mime_type: f.type, owner: state.currentUser.username,
                     created_at: new Date().toISOString().slice(0,19).replace('T',' '),
                     updated_at: new Date().toISOString().slice(0,19).replace('T',' ') };
      state.files.unshift(mock);
    });
    state.filteredFiles = [...state.files];
    renderFiles();
    toast(`✅ 拖拽上传 ${files.length} 个文件`, 'success');
  });
}

// ══════════════════════════════════════════════
//  Modal helpers
// ══════════════════════════════════════════════
function openModal(id)  { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.modal-overlay').forEach(el =>
  el.addEventListener('click', e => { if (e.target === el) el.classList.remove('show'); })
);

// ══════════════════════════════════════════════
//  Toast
// ══════════════════════════════════════════════
function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// Boot
init();
</script>
