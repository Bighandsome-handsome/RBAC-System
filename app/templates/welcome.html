<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎来到 FileVault 安全文件管理系统</title>
    <style>
        /* ── 完美的极光渐变背景，尽显高级感 ── */
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", -apple-system, sans-serif;
            background: linear-gradient(135deg, #6a11cb, #2575fc); /* 经典紫蓝流动渐变 */
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            font-size: 3.5em;
            margin-bottom: 0.2em;
            letter-spacing: 2px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        p {
            font-size: 1.3em;
            margin-bottom: 2.5em;
            opacity: 0.9;
            font-weight: 300;
        }

        /* ── 按钮排列布局 ── */
        .button-group {
            display: flex;
            gap: 25px;
        }

        /* ── 磨砂玻璃质感的按钮 ── */
        .btn {
            background-color: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.7);
            color: white;
            padding: 14px 36px;
            font-size: 1.1em;
            font-weight: 500;
            border-radius: 30px; /* 圆角变成胶囊状，更现代 */
            cursor: pointer;
            backdrop-filter: blur(4px); /* 现代毛玻璃效果 */
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* ── 鼠标悬停的高亮震荡动效 ── */
        .btn:hover {
            background-color: white;
            color: #2575fc;
            transform: translateY(-3px); /* 悬停时微微上浮 */
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.3);
        }

        /* 点击时微微按下的动态反馈 */
        .btn:active {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <h1>FileVault</h1>
    <p>我们的 RBAC 深邃、流动，且无边无际...</p>

    <div class="button-group">
        <button class="btn" onclick="location.href='/login'">安全登录</button>
        
        <button class="btn" onclick="location.href='/register'">账户注册</button>
    </div>

</body>
</html>
